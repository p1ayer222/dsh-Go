# Unsigned IPA only — skip simulator/engine regression (p1ayer222 fork).
name: iOS unsigned IPA only

on:
  workflow_dispatch:
  push:
    branches: [main, 'ios/**']
    paths:
      - 'app/**'
      - 'tooling/ios/**'
      - '.github/workflows/ios-ipa-only.yml'

permissions:
  contents: read

concurrency:
  group: ios-ipa-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Flutter
        run: |
          archive="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$archive" -x 'flutter/bin/cache/artifacts/engine/android-*/*' -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          flutter --version
          python3 app/tool/l10n_merge.py --no-gen
          cd app && flutter pub get --enforce-lockfile && flutter gen-l10n

      - name: Archive unsigned IPA
        run: bash tooling/ios/check-archive.sh

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/DSH-Go-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
